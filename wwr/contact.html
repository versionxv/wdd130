<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us The Rapids page</title>
    <meta name="description"
      content="Online web page talking about the contact information of The Rapids, a white water rafting rafting company">
    <meta name="author" content="Miguel J. Subero Saballo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/the-rapids-logo.jpg" alt="The Rapids' logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="about">
            <h1>The Rapids</h1>
            <p>321 Name Street</p>
            <p>Planet, Earth</p>
            <p>+1 234 567 890</p>
            <p>info@therapids.com</p>
        </div>

        <section class="info">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d8832512.85797939!2d-28.77852996639607!3d6.8661870875053195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sbr!4v1780681596808!5m2!1ses!2sbr"
                  width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form action="">
                <div class="user">
                    <div>
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name">
                    </div>

                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="multiple">
                        <div>
                            <p>Message Purpose</p>
                        </div>

                        <div>
                            <div>
                                <label for="box1">General Inquiry</label>
                                <input type="checkbox" id="box1" name="box1">
                            </div>

                            <div>
                                <label for="box2">Reservation Question</label>
                                <input type="checkbox" id="box2" name="box2">
                            </div>

                            <div>
                                <label for="box3">Website Suggestion</label>
                                <input type="checkbox" id="box3" name="box3">
                            </div>
                        </div>

                    </div>


                    <div class="textbox">
                        <label for="message">Message</label>
                        <textarea name="message" id="message">Type here</textarea>
                    </div>

                    <div class="check2">
                        <input type="checkbox" id="box4" name="box4">
                        <label for="box4">Please Subcribe me to the monthyly newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </div>
            </form>


        </section>
    </main>


    <section class="employee">
        <h2>We Are Here to Serve You</h2>

        <p></p>

        <figure>
            <img src="images/calm-river.jpg" alt="The Calm River">
            <figcaption>Employee Profile</figcaption>
        </figure>

        <figure>
            <img src="images/calm-river.jpg" alt="The Calm River">
            <figcaption>Employee Profile</figcaption>
        </figure>

        <figure>
            <img src="images/calm-river.jpg" alt="The Calm River">
            <figcaption>Employee Profile</figcaption>
        </figure>
    </section>

    <footer>
        <p>©2026 | The Rapids | Miguel J. Subero Saballo |</p>
        <nav class="socialmedia">
            <a href="https://tiktok.com">
                <img src="images/tiktok-bw.svg" alt="Tiktok logo in black and white.">
            </a>

            <a href="https://X.com">
                <img src="images/x-bw.svg" alt="X logo in black and white.">
            </a>

            <a href="https://youtube.com/">
                <img src="images/youtube-bw.svg" alt="YouTube logo in black and white.">
            </a>
        </nav>
    </footer>

</body>

</html>
